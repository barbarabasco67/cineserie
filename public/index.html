<html lang="es">
<head>

<title>Butaca — prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ft:'Fraunces',Georgia,serif;--fb:'Nunito',system-ui,sans-serif;--acc-rgb:232,135,58;--glow:#2a1a10;--tabbg:rgba(20,14,10,.97);--page:#080605;--zoom:1;--bg:#110c09;--bg2:#1a120d;--card:#231913;--card2:#2e2118;--line:#45332a;--text:#f6ebdd;--muted:#c2ad99;--accent:#e8873a;--ink:#1d0f08;--soft:#e9c27f;--sage:#b8dcae;--rose:#f08fa5;--w1:#241811;--w2:#170f0a;--b1:#8a5a36;--b2:#523322}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.4;display:flex;justify-content:center;align-items:center}
button{font-family:inherit;color:inherit}
.app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(120% 45% at 50% 0%,var(--glow) 0%,var(--bg) 60%)}
@media (min-width:520px){.app{height:min(100dvh,880px);border-radius:34px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55)}}
#screen,#sheet{zoom:var(--zoom)}
#screen{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 110px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
h1,h2,h3{margin:0;font-family:var(--ft);font-weight:700;letter-spacing:-.01em}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:13px;font-family:var(--fb);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 0 10px;font-weight:700}

.small{font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}

.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-weight:700;font-size:12px}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}

.btn{background:var(--accent);color:var(--ink);border:0;border-radius:10px;padding:8px 13px;font:700 13px var(--fb);display:inline-flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}

.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.tonight{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 22px;margin:2px 0 8px;color:#fff3ea;background:radial-gradient(120% 90% at 90% -15%,rgba(var(--acc-rgb),.6),transparent 58%),radial-gradient(90% 80% at -5% 115%,rgba(160,40,70,.6),transparent 62%),linear-gradient(160deg,#2c1522,#150a0f 72%);border:1px solid rgba(var(--acc-rgb),.5);box-shadow:0 22px 44px -14px rgba(var(--acc-rgb),.5),inset 0 0 0 1px rgba(255,255,255,.05)}
.tonight::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 30% 70%,#ffd9b8 50%,transparent 52%),radial-gradient(1.5px 1.5px at 55% 15%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 72% 62%,#fff 50%,transparent 52%),radial-gradient(1.5px 1.5px at 88% 38%,#ffd9b8 50%,transparent 52%),radial-gradient(1px 1px at 44% 88%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 8% 80%,#fff 50%,transparent 52%);opacity:.7;animation:twk 4.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes twk{from{opacity:.35}to{opacity:.85}}
.tn-beam{position:absolute;top:-40px;right:-30px;width:240px;height:300px;background:linear-gradient(200deg,rgba(255,226,190,.28),transparent 70%);clip-path:polygon(60% 0,100% 0,100% 40%,0 100%,0 80%);transform-origin:90% 0;animation:sway 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.tn-in{position:relative;z-index:1}
.tn-k{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--acc-rgb));background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.4);padding:5px 11px;border-radius:99px;margin-bottom:14px}
.tonight h2,.tn-h{font:700 26px/1.12 var(--ft);margin:0 0 8px;color:#fff3ea}.tonight .now h2{font-size:21px}
.tn-p{margin:0 0 18px;color:#e9d3c4;font-size:15px;max-width:30ch}.tn-sub{margin:0 0 6px;color:#e0c6b4;font-size:13px}.tonight .clamp{color:#ecd9cb}
.tn-btn{padding:14px 22px;font-size:16px;box-shadow:0 10px 26px -6px rgba(var(--acc-rgb),.75)}
.tn-ghost{background:rgba(255,255,255,.08);color:#fff3ea;border-color:rgba(255,255,255,.25)}
@media (prefers-reduced-motion:reduce){.tonight::before,.tn-beam{animation:none}}
.sign-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}.sign-row h1{margin:4px 0 0}
.sg{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;padding:7px 0;border-radius:12px;border:1px solid rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.1);color:var(--accent);font:700 10px var(--fb);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;flex:none}.sg:active{transform:scale(.94)}
.deco-shelf{margin-bottom:6px}.decos{display:flex;justify-content:space-around;align-items:flex-end;min-height:66px;padding:0 6px}.deco{display:block;width:56px;height:56px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}.deco svg{width:100%;height:100%;display:block}.deco.lampara{filter:drop-shadow(0 0 14px rgba(255,200,120,.55))}
.deco-empty{display:block;width:100%;border:0;cursor:pointer;color:var(--accent);font:700 13px var(--fb);margin-bottom:6px}.deco-empty>span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:54px;border:1px dashed rgba(var(--acc-rgb),.45);border-radius:10px;margin-bottom:4px}
.decopick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:inherit;cursor:pointer;font:600 11px var(--fb)}.dpick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--acc-rgb),.3)}.dpick .dv{width:42px;height:42px;display:block}.dpick svg{width:100%;height:100%}
.vhero{padding:20px 20px 18px}.vhero .tn-h{font-size:30px;letter-spacing:.02em;margin:0 0 4px}
.vtools{display:flex;gap:8px;margin:12px 0 14px}.vbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;font:700 13px var(--fb);cursor:pointer}.vbtn.main{background:var(--accent);color:var(--ink);border-color:var(--accent)}.vbtn:active{transform:scale(.96)}
.marq{padding:14px 18px;text-align:center;margin-bottom:12px}.marq .bulbs{padding:0 2px}.marq .bulbs i{background:#ffe2a8;box-shadow:0 0 9px 1px rgba(var(--acc-rgb),.95)}
.marq h1{font:700 34px/1.1 var(--ft);letter-spacing:.2em;text-indent:.2em;margin:12px 0;color:#fff3ea;text-shadow:0 0 6px rgba(255,214,160,.9),0 0 22px rgba(var(--acc-rgb),.9),0 0 42px rgba(var(--acc-rgb),.6)}
.frow{display:flex;gap:10px;align-items:center}.frow .row-scroll{flex:1;min-width:0}
.addslot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:2/3;border:2px dashed rgba(var(--acc-rgb),.55);border-radius:10px;background:rgba(var(--acc-rgb),.06);color:var(--accent);cursor:pointer;font:700 11px var(--fb);text-align:center;padding:6px}.addslot span{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1.500px solid currentColor}
.slots .deco{align-self:end;justify-self:center;width:100%;max-width:70px;height:auto;aspect-ratio:1;margin-bottom:2px}
.dlist{display:grid;gap:8px}.drow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}.drow .dv{width:34px;height:34px;display:block}.drow .dv svg{width:100%;height:100%}
.vwall{display:flex;justify-content:center;align-items:flex-start;gap:14px;padding:18px 12px 26px;margin-bottom:14px;border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 18px),linear-gradient(180deg,#2b1a14,#1c110c);border:1px solid var(--line);border-bottom:6px solid #3a2417;box-shadow:inset 0 -18px 24px -14px rgba(0,0,0,.6)}
.wfr{position:relative;padding-top:20px}.plight{position:absolute;top:0;left:50%;width:52%;height:5px;margin-left:-26%;border-radius:3px;background:linear-gradient(#e8c47a,#a8803a)}
.plight::after{content:"";position:absolute;top:5px;left:-30%;width:160%;height:56px;background:linear-gradient(rgba(255,214,150,.38),transparent);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);pointer-events:none}
.frame{display:block;width:100%;padding:5px;border:0;border-radius:3px;cursor:pointer;background:linear-gradient(135deg,#c79a5c,#7a5530);box-shadow:0 8px 16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18)}.frame .poster,.frame>div{border-radius:1px}.frame.empty{display:grid;place-items:center;aspect-ratio:2/3;color:#e8c47a;background:#1a0f0a;border:5px solid #8a5a36}
.nprog{display:flex;gap:6px;margin:14px 0 4px}.nprog i{flex:1;height:4px;border-radius:9px;background:var(--line)}.nprog i.on{background:var(--accent)}
.nopts{display:grid;gap:10px;margin-top:12px}.nopt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .2s}.nopt:active{transform:scale(.98)}.nopt:hover{border-color:var(--accent)}.nopt .si{color:var(--accent);display:grid}
.chip{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:999px;font:600 12px var(--fb);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.dd{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}.dd-h{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:none;border:0;color:var(--text);cursor:pointer;text-align:left}.dd-h span{display:flex;flex-direction:column;gap:2px}.dd-h small{color:var(--soft);font:600 12px var(--fb)}.dd-h svg{transition:transform .2s;transform:rotate(90deg)}.dd-h[aria-expanded=true] svg{transform:rotate(-90deg)}.dd-b{padding:2px 14px 14px}
.kind{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--fb);border-radius:6px;padding:2px 7px;margin-right:4px;vertical-align:middle}.kind.peli{background:var(--accent);color:var(--ink)}.kind.serie{border:1px solid var(--accent);color:var(--accent)}
.nrow{gap:12px}.ncard{flex:none;width:104px;background:none;border:0;padding:0;text-align:left;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:6px}.ncard b{font:700 13px/1.2 var(--fb);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ncard .kind{align-self:flex-start}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}.seg3 button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:7px 0;font:700 12px var(--fb);cursor:pointer}.seg3 button[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.row-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.wrap{display:flex;gap:8px;flex-wrap:wrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#1d1510}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster svg{position:absolute;inset:0;width:100%;height:100%}
.poster .pt{position:absolute;left:10px;right:10px;bottom:10px;font:700 15px/1.15 var(--ft);color:#fff7ef;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.poster.sm{border-radius:10px}.poster.sm .pt{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px}
.pcard{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.pmeta{margin-top:8px;font-size:12.5px;color:var(--muted)}
.bar{height:7px;background:#45332a;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--rose));border-radius:99px;transition:width .4s}
.now{display:flex;gap:14px}
.now .poster{width:84px;flex:none}
.now .info{flex:1;min-width:0}
.now h2{font-size:19px;margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:600;color:var(--soft);background:rgba(242,196,122,.13);border-radius:999px;padding:3px 10px}
.plat{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:3px 8px;display:inline-flex;gap:4px;align-items:center}
.plat.mine{border-color:var(--sage);color:var(--sage)}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item .poster{width:48px;flex:none}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:14px;color:var(--muted)}
.search input{flex:1;background:none;border:0;color:var(--text);font:600 15px var(--fb);padding:13px 0;outline:none}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 6px;width:100%;background:none;border:0;padding:0;cursor:pointer;font:600 14px var(--fb);text-align:left}
.switch .tr{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff3ea;transition:.2s}
.switch[aria-checked="true"] .tr{background:var(--accent)}
.switch[aria-checked="true"] .tr::after{left:21px}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(35,25,19,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:4}
.tabs button{background:none;border:0;border-radius:20px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11px var(--fb);color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);background:rgba(var(--acc-rgb),.16)}
.backdrop{position:absolute;inset:0;background:rgba(10,6,14,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg2);border-radius:28px 28px 0 0;border-top:1px solid var(--line);transform:translateY(103%);transition:transform .3s;padding:18px 18px calc(26px + env(safe-area-inset-bottom));z-index:6}
.sheet.on{transform:none}
.sheet-head{display:flex;gap:14px;align-items:flex-start}
.sheet-head .poster{width:74px}
.sheet-head.big{align-items:stretch}.sheet-head.big .grow{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding-right:44px}.sheet-head.big h2{font-size:25px;line-height:1.1;margin:0}.sheet-head.big .tag{font-size:13px;padding:5px 12px}.sheet-head.big .icon-btn{position:absolute;right:16px}.sheet-head.big .poster{width:124px;flex:none;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.cover-head{position:relative;text-align:center}.cover-head .icon-btn{position:absolute;right:0;top:0;z-index:2;background:rgba(17,12,9,.7)}.cover-head .cover{width:min(62%,250px);margin:0 auto 14px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.55))}.cover-head .cover .poster{border-radius:12px}.cover-head h2{margin:0}
.sheet-head .grow{flex:1;min-width:0}
.crew{margin:10px 0 0;display:grid;gap:6px}.crew div{display:flex;gap:10px;font:600 13px/1.35 var(--fb)}.crew dt{color:var(--muted);width:78px;flex:none}.crew dd{margin:0;color:var(--text)}
.comm{display:flex;gap:12px;align-items:center}.no2{font:800 18px var(--ft);color:var(--accent);width:18px;text-align:center;flex:none}
.score{display:flex;gap:14px;align-items:center;margin:6px 0 4px}.score input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}.ticks{display:flex;justify-content:space-between;font:600 10px var(--fb);color:var(--muted)}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}.ring svg{position:absolute;inset:0}.ring b{position:relative;font:800 17px var(--fb);color:#fff7ef}.ring sup{font-size:8px;margin-left:1px}
.link{background:none;border:0;color:var(--soft);font:600 12px var(--fb);display:inline-flex;gap:5px;align-items:center;cursor:pointer;padding:6px 0}
.rate{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:0}
.rate .lbl{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--c)}
.meter{display:flex;gap:7px}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:transparent;padding:0;cursor:pointer}
.dot.on{background:var(--c);border-color:var(--c)}
.stepper{display:flex;align-items:center;gap:12px;margin-top:6px}

.toast.on{opacity:1;transform:translate(-50%,0)}
.vote{width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;display:block;position:relative;overflow:hidden}
.vote+.vote{margin-top:8px}

.vote .in{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}

.avatars{display:flex}

.badge:last-child{border-bottom:0}

.salon{border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.foot{margin:26px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.pcard{position:relative}
.sign{border:2px solid var(--accent);border-radius:18px;padding:12px 14px;text-align:center;background:#1a120d;box-shadow:0 0 20px rgba(var(--acc-rgb),.18),inset 0 0 14px rgba(var(--acc-rgb),.08);margin-bottom:18px}

@keyframes tw{50%{opacity:.4}}
.shelf{background:linear-gradient(var(--w1),var(--w2));border-radius:8px 8px 0 0;padding:16px 10px 0;margin-bottom:20px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.plank{height:14px;margin:0 -10px;border-radius:3px;background:linear-gradient(var(--b1),var(--b2));box-shadow:0 8px 14px rgba(0,0,0,.45)}
.stub{position:absolute;top:6px;left:6px;font:700 10px var(--fb);background:var(--accent);color:var(--ink);border-radius:5px;padding:2px 6px}
.poster.tiny .pt{font-size:12px;left:7px;right:7px;bottom:7px}
.syn{margin:0;color:var(--text);opacity:.92;font-size:14px;line-height:1.5}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:16px}
.seg button{background:none;border:0;border-radius:12px;padding:9px 0;font:700 13px var(--fb);color:var(--muted);cursor:pointer}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .hd{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:4px}
.day{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:none;font:700 13px var(--fb);cursor:pointer;display:grid;place-items:center}
.day i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.day.today{border-color:var(--soft)}
.day.sel{background:var(--accent);color:var(--ink)}.day.sel i{background:var(--ink)}
.dt{width:46px;flex:none;text-align:center;font:700 12px var(--fb);color:var(--soft);line-height:1.2}
.dt b{display:block;font:700 20px var(--ft);color:var(--text)}
.bell[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.news{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer}
.news:last-child{border-bottom:0}
.news .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.news b{display:block;font:700 16px/1.25 var(--ft);margin:4px 0}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld input,.fld textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);font:600 15px var(--fb);padding:12px 14px;outline:none;resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fin{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;font:700 13px var(--fb);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left}
.fin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fin .sw{width:100%;height:26px;border-radius:7px}
.fins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prem{font-size:11px;color:var(--soft);display:inline-flex;gap:4px;align-items:center}
.slots.c4{grid-template-columns:repeat(4,1fr);gap:8px}
.slots.g{row-gap:16px}
.grid3{background:none;padding:0}
.me{display:flex;gap:14px;align-items:center}
.me .ava{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font:700 22px var(--ft);flex:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.strip small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.strip button{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.strip .e{aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.seas{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tabs{left:0;right:0;bottom:0;border-radius:0;border:0;border-top:1px solid var(--line);background:var(--tabbg);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border-radius:0;position:relative}
.tabs button[aria-current="page"]{background:none}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
#screen{padding-bottom:92px}
.toast{bottom:84px}
.seg{display:flex;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;margin-bottom:16px}
.seg button{flex:1;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 4px;font-size:12px}
.seg button[aria-pressed="true"]{background:none;color:var(--accent);border-bottom-color:var(--accent)}
.chip{border-radius:8px}.btn{border-radius:8px}
.place{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);text-align:left;cursor:pointer;margin-bottom:14px}
.place svg{width:100%;height:150px}
.place .pi{display:block;padding:12px 14px 14px}
.place .pi b{display:block;font:700 20px var(--ft)}
.venue{position:relative;margin:calc(-18px - env(safe-area-inset-top)) -18px 6px}
.venue>svg{width:100%;height:170px}
.venue::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.venue .back{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;background:rgba(17,12,9,.6);z-index:2}
.venue .vt{position:absolute;left:18px;bottom:6px;z-index:1}
.venue .vt small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ticket{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 14px;margin-bottom:12px;cursor:pointer;color:inherit}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-8px}.ticket::after{right:-8px}
.ticket .no{font:700 26px var(--ft);color:var(--accent);min-width:30px;text-align:center;padding-right:10px;border-right:2px dashed var(--line)}
.ticket .poster{width:44px;flex:none}
.ticket .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--soft)}
.gcell b{color:var(--text);font:700 15px var(--ft)}
.gcell[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.post{padding:16px 0;border-bottom:1px solid var(--line)}
.ph{display:flex;gap:10px;align-items:center}
.av2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--fb);color:var(--ink);flex:none}
.att{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:inherit}
.att .poster{width:40px;flex:none}.att .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.att .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.acts{display:flex;gap:18px;margin-top:10px}
.act{background:none;border:0;display:flex;gap:6px;align-items:center;color:var(--muted);font:700 13px var(--fb);cursor:pointer;padding:4px 0}
.act.on{color:var(--rose)}
select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);font:600 15px var(--fb);padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- pulido: movimiento y efectos ---------- */
.ring{flex:none;min-width:0}.ring svg{width:100%;height:100%}.list-item .ring{margin-left:4px}
:root{--ease:cubic-bezier(.2,.8,.2,1)}
.btn,.chip,.icon-btn,.seg3 button,.dd-h,.dot,.place,.list-item,.ticket,.ncard,.pcard,.gcell,.vote,.act,.link,.att{transition:transform .2s var(--ease),box-shadow .25s,background-color .2s,border-color .2s,color .2s,opacity .2s;-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.icon-btn:active,.seg3 button:active,.place:active,.ticket:active,.gcell:active,.vote:active,.act:active{transform:scale(.95)}
.list-item:active{background:rgba(var(--acc-rgb),.07)}
.btn{position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(var(--acc-rgb),.22)}
.btn.ghost{box-shadow:none}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s var(--ease)}
.btn:active::after,.btn:hover::after{transform:translateX(120%)}
.btn.ghost::after{display:none}
.chip[aria-pressed="true"]{box-shadow:0 3px 10px rgba(var(--acc-rgb),.3)}
.card,.place,.ticket{transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
@media (hover:hover){.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(var(--acc-rgb),.35)}.chip:hover,.icon-btn:hover,.seg3 button:hover{border-color:var(--accent)}.place:hover,.ticket:hover,.gcell:hover{transform:translateY(-2px);border-color:rgba(var(--acc-rgb),.55);box-shadow:0 10px 24px rgba(0,0,0,.35)}.ncard:hover .poster,.pcard:hover .poster{transform:translateY(-3px)}}
.ncard .poster,.pcard .poster{transition:transform .3s var(--ease),box-shadow .3s}.ncard:active .poster,.pcard:active .poster{transform:scale(.96)}
.ncard .poster{box-shadow:0 8px 18px rgba(0,0,0,.4)}
/* cambio de página */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
#screen.enter>*{animation:rise .5s var(--ease) both}
#screen.enter>*:nth-child(2){animation-delay:.05s}#screen.enter>*:nth-child(3){animation-delay:.1s}#screen.enter>*:nth-child(4){animation-delay:.15s}#screen.enter>*:nth-child(5){animation-delay:.2s}#screen.enter>*:nth-child(6){animation-delay:.25s}#screen.enter>*:nth-child(n+7){animation-delay:.3s}
/* barra inferior */
.tabs{overflow:hidden}
.tabs .ind{position:absolute;top:0;left:0;width:20%;height:100%;pointer-events:none;transform:translateX(calc(var(--i,0)*100%));transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.tabs .ind::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--accent);box-shadow:0 2px 12px rgba(var(--acc-rgb),.7)}
.tabs .ind::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 50% 0,rgba(var(--acc-rgb),.2),transparent 80%)}
.tabs button[aria-current="page"]::before{display:none}
.tabs button{transition:color .25s,transform .2s var(--ease)}.tabs button:active{transform:scale(.9)}
.tabs button svg{transition:transform .3s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:translateY(-4px) scale(1.18)}100%{transform:none}}
.tabs button.pop svg{animation:pop .45s var(--ease)}
/* ficha */
.sheet{transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.backdrop{transition:opacity .35s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet.fresh .sheet-head,.sheet.fresh h3,.sheet.fresh .syn{animation:rise .5s var(--ease) both}
.toast{transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.25,1)}

/* ---------- apertura: cortinas de cine ---------- */
.splash{position:absolute;inset:0;z-index:50;overflow:hidden;pointer-events:none;animation:sfade .35s 1.85s ease forwards}
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
.splash .ir{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,transparent var(--r),rgba(var(--acc-rgb),.95) calc(var(--r) + .6%),rgba(var(--acc-rgb),.25) calc(var(--r) + 2.5%),transparent calc(var(--r) + 7%)),radial-gradient(circle at 50% 46%,transparent var(--r),#0d0805 calc(var(--r) + .6%));animation:iris 1.5s .35s cubic-bezier(.7,0,.2,1) forwards}
@keyframes iris{from{--r:0%}to{--r:112%}}
@keyframes sfade{to{opacity:0}}
.app.opening #screen,.app.opening .tabs{animation:unveil 1.6s .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes unveil{from{opacity:.25;transform:scale(1.05)}to{opacity:1;transform:none}}
/* ---------- aspecto ---------- */
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgsw{border:2px solid var(--line);border-radius:14px;padding:0;background:none;cursor:pointer;overflow:hidden;text-align:left}
.bgsw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--acc-rgb),.35)}
.bgsw .pv{height:54px;display:flex;align-items:flex-end;padding:8px}.bgsw .pv i{display:block;height:18px;width:70%;border-radius:6px}
.bgsw span.n{display:block;padding:6px 8px;font:700 12px var(--fb);background:var(--card);color:var(--text)}
.accs{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.acc{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.acc[aria-pressed="true"]{border-color:var(--text)}
.accs input[type=color]{width:36px;height:36px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer}
.fam{display:flex;flex-wrap:wrap;gap:8px}.fam .chip{font-size:14px}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
[data-theme="light"] .tabs .ind::after{background:radial-gradient(60% 90% at 50% 0,rgba(var(--acc-rgb),.18),transparent 80%)}
[data-theme="light"] .app{box-shadow:0 30px 80px rgba(60,40,20,.25)}
[data-theme="light"] .sheet{box-shadow:0 -10px 40px rgba(60,40,20,.18)}
/* ---------- perfil social y ajustes ---------- */
.pf-head{position:relative;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);margin-bottom:16px}
.mediaed{margin:4px 0 6px}.me-ban{height:92px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(var(--acc-rgb),.5),rgba(var(--acc-rgb),.08)) center/cover;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px}.me-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.me-row .pf-ava{border-width:3px}
.pf-banner{height:112px;background:linear-gradient(120deg,rgba(var(--acc-rgb),.6),rgba(var(--acc-rgb),.08) 75%),var(--card2)}
.pf-nav{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.pf-nav .icon-btn{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.18);color:#fff}
#screen>.pf-nav{position:static;margin-bottom:12px}
.pf-body{padding:0 16px 14px;margin-top:-40px;position:relative}
.pf-top{display:flex;justify-content:space-between;align-items:flex-end}
.pf-ava{width:80px;height:80px;border-radius:50%;border:4px solid var(--card);background:var(--accent);color:var(--ink);display:grid;place-items:center;font:700 32px var(--ft);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.pf-name{font:700 24px var(--ft);margin:10px 0 0}
.pf-bio{margin:8px 0 0;font-size:14px;line-height:1.4}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.pf-stats>button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}.pf-stats>button:disabled{cursor:default;opacity:.6}.lock{display:inline-flex;vertical-align:middle;margin-left:8px;color:var(--accent)}.reqb{margin:12px 0}.pf-stats b{display:block;font:700 19px var(--ft)}.pf-stats span{font-size:12px;color:var(--muted)}
.pf-strip{padding:0 16px 16px;margin-top:0}.pf-strip .sn{display:block;font:600 11px/1.2 var(--fb);color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pf-mini{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font:700 16px var(--ft);flex:none}
.ulink{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.set-h{font:700 12px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.srow{display:flex;gap:12px;align-items:center;width:100%;padding:13px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.card .srow:last-child{border-bottom:0}
.srow .si{width:36px;height:36px;border-radius:11px;background:rgba(var(--acc-rgb),.15);color:var(--accent);display:grid;place-items:center;flex:none}
.srow .grow{flex:1;min-width:0}.srow b{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="splash" id="splash" aria-hidden="true"><i class="ir"></i></div>
  <main id="screen" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Navegación principal"></nav>
  <div class="backdrop" id="backdrop" data-act="close"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ficha"></section>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ---------- iconos de línea ---------- */

const pct=s=>s.eps?Math.round(s.ep/s.eps*100):0;

const li=s=>`<button class="list-item" data-act="open" data-id="${s.id}">${poster(s,'sm')}<span class="grow"><b>${s.title}</b><span class="muted small">${kind(s)} ${s.tags.slice(0,2).join(' · ')}</span><span class="clamp">${esc(s.syn)}</span></span>${s.avg?ring(s.avg,38,false):''}${ic('chevron',18)}</button>`;
let WEEKLY=[];
const weeklyRank=()=>{const l=WEEKLY.map(w=>({s:byId(w.title_id),w})).filter(x=>x.s).slice(0,5);return `<div class="sec"><h2>Mejor puntuadas de la semana</h2></div>`+(l.length?`<div class="card" style="padding:4px 16px">${l.map((x,i)=>`<button class="list-item" data-act="open" data-id="${x.s.id}"><span class="no2">${i+1}</span>${poster(x.s,'sm')}<span class="grow"><b>${esc(x.s.title)}</b><span class="muted small">${kind(x.s)} ${x.w.votes} ${x.w.votes>1?'votos':'voto'}</span></span>${ring(x.w.avg,42,false)}</button>`).join('')}</div>`:`<div class="card muted">Aún no hay votos esta semana. Puntúa una película o serie y abre el ranking.</div>`)};
const newRow=(type,h)=>{const l=SHOWS.filter(s=>s.type===type&&!s.leaving).sort((a,b)=>b.id-a.id).slice(0,8);return l.length?`<div class="sec"><h2>${h}</h2></div><div class="row-scroll nrow">${l.map(s=>`<button class="ncard" data-act="open" data-id="${s.id}" aria-label="Abrir ${esc(s.title)}">${poster(s,'sm')}<b>${esc(s.title)}</b>${kind(s)}</button>`).join('')}</div>`:''};
const fmtMin=m=>m>=60?`${Math.floor(m/60)} h ${m%60?String(m%60).padStart(2,'0')+' min':''}`.trim():m+' min';
const kind=s=>`<span class="kind ${s.type==='Serie'?'serie':'peli'}">${ic(s.type==='Serie'?'tv':'clapper',12)}${s.type}</span>`;
const fmt=n=>n.toLocaleString('es-ES');
function ticketList(type){
 const m=S.rank==='mes'?0:1;
 const l=SHOWS.filter(s=>s.type===type&&STATS[s.id]).sort((a,b)=>STATS[b.id][m]-STATS[a.id][m]).slice(0,6);
 const gems=SHOWS.filter(s=>s.type===type&&STATS[s.id]&&STATS[s.id][1]<3000&&STATS[s.id][2]>=4.4);
 const verb=type==='Serie'?'siguiendo':'espectadoras';
 return `<div class="seas"><h2>${type==='Serie'?'En el sofá':'Taquilla'}</h2><div class="wrap">${[['mes','Este mes'],['siempre','Siempre']].map(([k,n])=>`<button class="chip" aria-pressed="${S.rank===k}" data-act="rank" data-v="${k}">${n}</button>`).join('')}</div></div>
 ${l.map((s,i)=>`<button class="ticket" data-act="open" data-id="${s.id}"><span class="no">${i+1}</span>${poster(s,'sm')}<span class="grow"><b>${s.title}</b><span class="muted small">${fmt(STATS[s.id][m])} ${verb} · ${s.year}</span><span class="small" style="color:var(--soft)">★ ${STATS[s.id][2].toFixed(1).replace('.',',')}</span></span></button>`).join('')}
 <div class="sec"><h2>Joyas escondidas</h2></div><p class="muted small" style="margin:-6px 0 8px">Pocas espectadoras y muy buenas notas.</p>
 <div class="card" style="padding:4px 16px">${gems.map(li).join('')}</div>`}
function pasillos(type){
 const gs=GENRES.map(g=>({...g,l:SHOWS.filter(s=>s.type===type&&(GMAP[s.id]||'').split(',').includes(g.k))})).filter(g=>g.l.length);
 const sel=gs.find(g=>g.k===S.genre);
 return `<div class="gen">${gs.map(g=>`<button class="gcell" aria-pressed="${S.genre===g.k}" data-act="genre" data-v="${g.k}">${ic(g.i,26)}<b>${g.k}</b><span class="muted small">${g.l.length} ${g.l.length>1?'títulos':'título'}</span></button>`).join('')}</div>
 ${sel?`<h3>${sel.k}</h3><div class="card" style="padding:4px 16px">${sel.l.map(li).join('')}</div>`:'<p class="muted small" style="margin-top:14px">Elige un pasillo para ver sus títulos.</p>'}`}
const EMPTY=m=>`<div class="card"><p class="muted small" style="margin:0">${m}</p></div>`;
function maratones(){
 if(!CLUBS.length)return EMPTY('Aún no hay maratones. Pronto podrás organizar la primera.');
 return CLUBS.map((c,i)=>{const j=S.joined.has(i);return `<div class="card"><span class="tag">${c.w}</span><h2 style="font-size:18px;margin:10px 0 4px">${c.t}</h2><p class="muted small" style="margin:0">${c.p} · ${c.n+(j?1:0)} apuntadas</p><div class="wrap" style="margin-top:12px"><button class="btn ${j?'ghost':''}" data-act="join" data-v="${i}" aria-pressed="${j}">${j?ic('check',18)+'Apuntada':'Apuntarme'}</button><button class="btn ghost" data-act="open" data-id="${c.id}">Ver ficha</button></div></div>`}).join('')}
function spoilers(){
 const s1=byId(1);
 if(REAL||!s1)return EMPTY('Aquí aparecerán las reacciones por episodio, sin spoilers. Todavía no hay ninguna.');
 return `<div class="card"><p class="muted small" style="margin:0 0 6px">Reacciones a «${s1.title}». Vas por el episodio ${s1.ep}: el resto se desbloquea al verlo.</p>
 ${REACTIONS.map((r,i)=>{const ok=i<s1.ep;return `<div class="react ${ok?'':'locked'}"><span class="ep">${ok?i+1:ic('lock',14)}</span><span>${ok?`<b>${r[0]}</b><br>${r[1]}`:`<span class="muted">Ve el episodio ${i+1} para leerlo</span>`}</span></div>`}).join('')}</div>`}
function directoras(){
 if(!DIRS.length)return EMPTY('Pronto: directoras del momento.');
 return `<div class="seas"><h2>Directoras del momento</h2></div>${DIRS.map((d,i)=>`<div class="ticket" style="cursor:default"><span class="no">${i+1}</span><span class="grow"><b>${d.n}</b><span class="muted small">${d.f} ${d.f>1?'películas':'película'} en la plataforma · ${fmt(d.v)} espectadoras</span></span></div>`).join('')}`}
function charla(){
 const s1=byId(1);
 return `${s1&&Object.keys(FRIENDS).length?`<div class="card"><span class="tag">En el mismo capítulo</span><p style="margin:10px 0 0">Lucía, Marta e Irene también van por el episodio ${s1.ep} de «${s1.title}».</p><div class="avatars" style="margin-top:10px">${Object.keys(FRIENDS).map(n=>`<span class="av" style="background:${AVC[n]}">${n[0]}</span>`).join('')}</div></div>`:''}
 <button class="btn block" style="margin:14px 0" data-act="postopen">${ic('plus',18)}Escribir en la charla</button>
 ${POSTS.map(postCard).join('')}`}
function quedadas(){
 if(!POLL.length)return EMPTY('Aún no hay noches de peli. Cuando haya una, podrás votar con tus amigas.');
 const tot=Object.values(FRIENDS).length+(S.vote?1:0);
 const cnt=id=>Object.values(FRIENDS).filter(v=>v===id).length+(S.vote===id?1:0);
 const lead=Math.max(...POLL.map(cnt));
 return `<div class="card"><h2>Noche de peli</h2><p class="muted small" style="margin:4px 0 14px">Viernes · Lucía, Marta e Irene ya han votado.</p>
 ${POLL.map(id=>{const s=byId(id),c=cnt(id),w=Math.round(c/tot*100);
  return `<button class="vote" aria-pressed="${S.vote===id}" data-act="vote" data-id="${id}"><span class="fill" style="width:${w}%"></span><span class="in"><span><b>${s.title}</b><br><span class="muted small">${s.platforms.join(' · ')}</span></span>
  <span style="display:flex;align-items:center;gap:8px"><span class="avatars">${Object.keys(FRIENDS).filter(n=>FRIENDS[n]===id).map(n=>`<span class="av" style="background:${AVC[n]}">${n[0]}</span>`).join('')}${S.vote===id?`<span class="av" style="background:#fff3ea">Tú</span>`:''}</span>${c===lead?`<span class="tag">Gana</span>`:''}</span></span></button>`}).join('')}</div>`}
function criticas(){
 if(!CRIT.length)return EMPTY('Todavía no hay críticas. Las primeras reseñas aparecerán aquí.');
 const l=[...CRIT].sort((a,b)=>S.rev==='res'?b.v-a.v:b.f-a.f);
 return `<div class="seg" role="group" aria-label="Orden">${[['res','Más reseñas'],['seg','Más seguidas']].map(([k,n])=>`<button aria-pressed="${S.rev===k}" data-act="rev" data-v="${k}">${n}</button>`).join('')}</div>
 ${l.map((c,i)=>`<div class="ticket" style="cursor:default"><span class="no">${i+1}</span><span class="grow"><b>${c.n}</b><span class="muted small">${c.h}</span><span class="small" style="color:var(--soft)">${S.rev==='res'?c.v+' reseñas en 30 días':fmt(c.f)+' seguidoras'}</span></span></div>`).join('')}`}
function placeView(){
 const P=PLACES[S.place],t=S.sub[S.place];
 const body={cine:{taquilla:()=>ticketList('Película'),pasillos:()=>pasillos('Película'),dir:directoras},casa:{sofa:()=>ticketList('Serie'),pasillos:()=>pasillos('Serie'),mar:maratones,spoil:spoilers},cafe:{charla,quedadas,crit:criticas}}[S.place][t]();
 return `<div class="venue"><button class="icon-btn back" data-act="placeback" aria-label="Volver a Comunidad">${ic('back',18)}</button>${scene(S.place)}<div class="vt"><small class="muted">${P.sub}</small><h1>${P.n}</h1></div></div>

 return `<div class="sheet-head"><div class="grow"><h2>Escribir en la charla</h2></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic('close',18)}</button></div>
 <label class="fld"><span>Tu mensaje</span><textarea id="f-post" rows="4" maxlength="400" placeholder="Cuenta qué has visto, sin spoilers">${esc(d.x)}</textarea></label>

function calendar(){
 const cells=['<span></span>'.repeat(6)];
 for(let d=1;d<=30;d++){const n=PREM.filter(p=>p.d===d).length;
  cells.push(`<button class="day ${d===TODAY?'today':''} ${S.cday===d?'sel':''}" data-act="day" data-v="${d}" aria-pressed="${S.cday===d}" aria-label="${d} de noviembre${n?', '+n+(n>1?' estrenos':' estreno'):''}">${d}${n?'<i></i>':''}</button>`)}
 const list=S.cday?PREM.filter(p=>p.d===S.cday):PREM.filter(p=>p.d>=TODAY);
 return `<div class="card"><div class="seas"><h2>Noviembre 2026</h2>${S.cday?`<button class="chip" data-act="day" data-v="${S.cday}">Ver todo el mes</button>`:''}</div>
 <div class="cal">${DAYS.map(d=>`<span class="hd">${d}</span>`).join('')}${cells.join('')}</div></div>
 <h3>${S.cday?dlabel(S.cday):'Próximos estrenos'}</h3>
 <div class="card" style="padding:4px 16px">${list.length?list.map(p=>`<div class="list-item" style="cursor:default"><span class="dt">${DAYS[(p.d+5)%7]}<b>${p.d}</b></span>
  <button class="grow" data-act="open" data-id="${p.id}" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0"><b>${p.t}</b><span class="muted small">${p.p}</span></button>
  <button class="icon-btn bell" data-act="bell" data-v="${p.i}" aria-pressed="${S.bells.has(p.i)}" aria-label="Avisarme: ${p.t}">${ic('bell',18)}</button></div>`).join(''):'<p class="muted" style="padding:12px 0;margin:0">Sin estrenos este día.</p>'}</div>`}
function newsView(){
 const l=NEWS.filter(n=>!S.newsMine||byId(n.id).status);
 return `<button class="switch" role="switch" aria-checked="${S.newsMine}" data-act="newsmine" style="margin-top:0"><span>Solo de mis series</span><span class="tr"></span></button>
 <div class="card" style="padding:4px 16px;margin-top:10px">${l.length?l.map(n=>`<button class="news" data-act="open" data-id="${n.id}"><span class="k">${n.k} · ${n.w}</span><b>${n.t}</b><span class="muted small">${n.x}</span></button>`).join(''):'<p class="muted" style="padding:12px 0;margin:0">Aún no hay noticias de tus series.</p>'}</div>`}

const dmy=d=>{const m=String(d||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?`${+m[3]}/${+m[2]}/${m[1]}`:''};
const crewHTML=s=>{const r=[['Dirección',s.director],['Guion',s.writers],['Estreno',dmy(s.release)],['Edad',s.age]].filter(x=>x[1]);return r.length?`<dl class="crew">${r.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:''};
function sheetHTML(s){

 return `<div class="sheet-head big">${poster(s)}<div class="grow"><div><h2>${s.title}</h2><p class="muted" style="margin:6px 0 0;font-size:14px">${kind(s)} ${s.year} · ${s.type==='Serie'?s.eps+' episodios':fmtMin(s.min)}</p>${s.director?`<p class="muted" style="margin:6px 0 0;font-size:14px">Dirige ${esc(s.director)}</p>`:''}</div><div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic('close',18)}</button></div>
 ${crewHTML(s)}
 <h3>Sinopsis</h3><p class="syn">${esc(s.syn)}</p><p class="muted small" style="margin:8px 0 0">${s.source==='user'?(s.proposed?'Añadido por ti · en revisión para el catálogo común':'Añadido por ti'):'Del catálogo'}</p>
 <h3>Estado</h3><div class="row-scroll">${statusFor(s).map(st=>`<button class="chip" aria-pressed="${s.status===st}" data-act="status" data-id="${s.id}" data-v="${st}">${st}</button>`).join('')}</div>
 ${s.type==='Serie'&&s.status&&s.status!=='Quiero ver'?`<div class="stepper"><button class="icon-btn" data-act="ep" data-id="${s.id}" data-v="-1" aria-label="Un episodio menos">${ic('minus',18)}</button><span><b>${s.ep}</b> de ${s.eps} episodios</span><button class="icon-btn" data-act="ep" data-id="${s.id}" data-v="1" aria-label="Un episodio más">${ic('plus',18)}</button></div>`:''}
 <h3>Dónde verla</h3><div class="wrap">${platChips(s)}</div>

 <h3>Comunidad</h3><div class="comm">${s.avg?ring(s.avg,56,false):`<span class="ring" style="width:56px;height:56px"><svg viewBox="0 0 64 64" width="56" height="56"><circle cx="32" cy="32" r="31" fill="#120b07"/><circle cx="32" cy="32" r="26" fill="none" stroke="#4a3b1c" stroke-width="5"/></svg><b>–</b></span>`}<span><b>${s.avg?'Puntuación de la comunidad':'Todavía sin puntuar'}</b><br><span class="muted small">${s.votes?`${s.votes} ${s.votes>1?'votos':'voto'}`:'Sé la primera en votar'}</span></span></div>

 <div class="score"><div class="grow"><p class="muted small" style="margin:0 0 4px">¿Qué te ha parecido ${esc(s.title)}?</p><input type="range" id="score" min="0" max="100" step="1" value="${s.r.score||0}" aria-label="Puntuación de 0 a 100" data-id="${s.id}"><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>${ring(s.r.score,64)}</div>
 ${s.r.score?`<button class="link" data-act="clearscore" data-id="${s.id}">${ic('close',13)}Borrar mi puntuación</button>`:''}
 <h3>Tu reseña</h3><label class="fld" style="margin-top:0"><textarea id="f-rev" rows="3" maxlength="400" data-id="${s.id}" placeholder="Cuéntalo en un par de frases (se verá en tu perfil)">${esc(s.review||'')}</textarea></label>
 <h3>Estado de ánimo</h3><div>${CATS.map(c=>`<div class="rate" style="--c:${c.c}"><span class="lbl">${ic(c.i,18)}${c.n}</span><span class="meter">${[1,2,3,4,5].map(n=>`<button class="dot ${s.r[c.k]>=n?'on':''}" data-act="rate" data-id="${s.id}" data-k="${c.k}" data-v="${n}" aria-label="${c.n} ${n} de 5"></button>`).join('')}</span></div>`).join('')}</div>`}

 [...t.querySelectorAll('button')].forEach((b,i)=>{const on=TABS[i][0]===S.tab;if(on&&b.getAttribute('aria-current')!=='page'){b.setAttribute('aria-current','page');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');t.style.setProperty('--i',i)}else if(!on)b.removeAttribute('aria-current')})}
function updateSheet(){
 const sh=$('#sheet'),top=sh.scrollTop,was=sh.classList.contains('on');
 if(S.sheet!==null){sh.innerHTML=typeof S.sheet==='number'?sheetHTML(byId(S.sheet)):S.sheet==='add'?addHTML():S.sheet==='post'?postHTML():S.sheet==='theme'?themeHTML():S.sheet==='user'?userHTML():S.sheet==='night'?nightHTML():S.sheet==='flist'?flistHTML():S.sheet==='reqs'?reqsHTML():S.sheet==='pass'?passHTML():S.sheet==='login'?loginHTML():styleHTML();sh.scrollTop=top}
 if(!was&&S.sheet!==null){sh.classList.add('fresh');setTimeout(()=>sh.classList.remove('fresh'),800)}

function watch(id){
 const s=byId(id);if(s.status!=='Viendo')return;
 if(s.ep<s.eps)s.ep++;S.coins+=10;
 if(s.ep>=s.eps){s.status='Vista';S.coins+=50;toast(`Terminada: ${s.title}. +60 palomitas`)}else toast(`Episodio ${s.ep} visto. +10 palomitas`);
 if(!S.today){S.today=true;S.streak++}
 syncLib(s);render();
}
function saveDraft(){

 const id=Math.max(...SHOWS.map(s=>s.id))+1,n=parseInt(d.n)||0,film=d.type==='Película';
 SHOWS.push({id,title:t,type:d.type,year:parseInt(d.year)||2026,eps:film?1:(n||8),min:film?(n||100):0,status:'Quiero ver',ep:0,platforms:[...d.plats],tags:[...d.tags],hue:[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%360,leaving:null,r:{llorar:0,reir:0,tension:0,romance:0,comfort:0,slow:0},syn:d.syn.trim(),source:'user',proposed:d.propose});
 const ns=SHOWS[SHOWS.length-1],old=ns.id;send('/titles','POST',{title:ns.title,type:ns.type,year:ns.year,episodes:ns.eps,minutes:ns.min,synopsis:ns.syn,hue:ns.hue,platforms:ns.platforms,tags:ns.tags,propose:ns.proposed}).then(r=>{if(r&&r.id){ns.id=r.id;if(S.sheet===old)S.sheet=r.id;render()}}).catch(()=>{});

const NQ=[

 {k:'vibe',q:'¿Qué rollo te apetece?',o:[['reir','Reírme un rato','smile'],['llorar','Llorar a gusto','drop'],['enamorar','Enamorarme','heart'],['tension','Pasar tensión','bolt'],['cozy','Algo reconfortante','mug'],['spicy','Algo picante','flame']]},

 {k:'time',q:'¿Cuánto tiempo tienes?',o:[['corto','Poco, algo cortito'],['normal','Una sesión normal'],['largo','Sin prisa, cuanto más mejor']]}];
const NV={
 reir:{g:['Comedia','Comedia romántica'],t:['Hot girl summer','Girls night','Grumpy x sunshine']},
 llorar:{g:['Drama'],t:['Para llorar']},
 enamorar:{g:['Romance','Comedia romántica'],t:['Enemies to lovers','Fake dating','Slow burn','Forbidden love','Situationship','Main character energy']},
 tension:{g:['Suspense','Misterio'],t:['Plot twist','Dark romance']},
 cozy:{g:['Cozy'],t:['Comfort','Cozy autumn','Slow burn']},
 spicy:{g:[],t:['Spicy','Dark romance','Forbidden love','Situationship','Enemies to lovers']}};
const NW={sola:['Comfort','Para llorar','Main character energy','Dark romance'],pareja:['Forbidden love','Slow burn','Fake dating','Enemies to lovers'],amigas:['Girls night','Hot girl summer','Para ver con amigas'],familia:['Comfort','Cozy autumn']};
const NWL={sola:'para una noche para ti',pareja:'para ver en pareja',amigas:'para ver con amigas',familia:'apta para ver en familia'};
function nightPick(a){
 const V=NV[a.vibe]||{g:[],t:[]},W=NW[a.who]||[];
 const cand=SHOWS.filter(x=>(!x.status||x.status==='Quiero ver')&&(a.type==='any'||x.type===a.type));
 const sc=cand.map(x=>{let n=0;const why=[];const gs=(GMAP[x.id]||'').split(',');
  const gm=V.g.filter(g=>gs.includes(g)),tm=V.t.filter(t=>x.tags.includes(t));
  n+=gm.length*3+tm.length*3;tm.slice(0,2).forEach(t=>why.push(t));if(!tm.length&&gm.length)why.push(gm[0]);
  const wm=W.filter(t=>x.tags.includes(t));n+=wm.length*2;
  if(a.who==='familia'){const ag=parseInt(x.age)||0;if(ag&&ag>=16)n-=8;else if(ag&&ag<=12)n+=3;if(x.tags.includes('Spicy')||x.tags.includes('Dark romance'))n-=6}
  if(a.who==='amigas'&&wm.length)why.push('plan de amigas');
  const m=x.type==='Película'?x.min:x.eps;
  if(x.type==='Película'){if(a.time==='corto'&&m&&m<=105)n+=3,why.push('dura '+m+' min');if(a.time==='corto'&&m>130)n-=3;if(a.time==='largo'&&m>=130)n+=2}
  else{if(a.time==='corto'&&m&&m<=8)n+=3,why.push('solo '+m+' episodios');if(a.time==='largo'&&m>=10)n+=2}
  if(avail(x).length)n+=3;
  if(x.avg)n+=Math.min(2,x.avg/50);
  return {x,n:n+Math.random()*1.5,why,who:wm.length?NWL[a.who]:''}}).sort((p,q)=>q.n-p.n);
 return sc.slice(0,5)}
function nightHTML(){const N=S.night;if(!N)return '';
 const close=`<button class="icon-btn" data-act="close" aria-label="Cerrar">${ic('close',18)}</button>`;
 if(N.step<NQ.length){const q=NQ[N.step];
  return `<div class="sheet-head"><div class="grow"><p class="muted small" style="margin:0">Pregunta ${N.step+1} de ${NQ.length}</p><h2>${q.q}</h2></div>${close}</div>
  <div class="nprog">${NQ.map((_,i)=>`<i class="${i<=N.step?'on':''}"></i>`).join('')}</div>
  <div class="nopts">${q.o.map(o=>`<button class="nopt" data-act="nq" data-k="${q.k}" data-v="${o[0]}">${o[2]?`<span class="si">${ic(o[2],20)}</span>`:''}<b>${o[1]}</b></button>`).join('')}</div>
  ${N.step?`<button class="btn ghost" style="margin-top:14px" data-act="nback">${ic('back',16)}Atrás</button>`:''}`}
 const r=N.res[N.i];
 if(!r)return `<div class="sheet-head"><div class="grow"><h2>Sin resultados</h2></div>${close}</div><p class="muted">No hay nada nuevo en el catálogo con esas respuestas. Prueba con otras.</p><button class="btn block" data-act="night">Empezar de nuevo</button>`;
 const x=r.x,mins=x.type==='Película'&&x.min?` · ${x.min} min`:x.type==='Serie'?` · ${x.eps} episodios`:'';
 const why=[...r.why.slice(0,2),r.who].filter(Boolean);
 return `<div class="sheet-head"><div class="grow"><p class="muted small" style="margin:0">Tu plan para esta noche</p><h2>${esc(x.title)}</h2></div>${close}</div>
  <div class="now" style="margin-top:12px"><button class="pcard" data-act="open" data-id="${x.id}" aria-label="Abrir ${esc(x.title)}" style="width:104px;flex:none">${poster(x,'sm')}</button>
  <div class="info"><p class="muted small" style="margin:0">${x.type} · ${x.year}${mins}</p>${why.length?`<p style="margin:8px 0 0;font-weight:600">Te la proponemos porque: ${why.join(', ')}.</p>`:''}<div class="wrap" style="margin-top:8px">${platChips(x)}</div></div></div>
  <p class="clamp" style="margin-top:12px">${esc(x.syn)}</p>
  <div class="wrap" style="margin-top:16px"><button class="btn" data-act="nwant" data-id="${x.id}">${ic('plus',18)}Quiero verla</button>${N.res.length>1?`<button class="btn ghost" data-act="nnext">${ic('shuffle',16)}Otra opción</button>`:''}<button class="btn ghost" data-act="night">Repetir</button></div>`}

const FMAP={'f-title':'title','f-year':'year','f-n':'n','f-syn':'syn'};
document.addEventListener('change',e=>{if(e.target.id==='f-rev'){const s=byId(Number(e.target.dataset.id));s.review=e.target.value.trim();if(!s.status)s.status=s.type==='Serie'?'Viendo':'Vista';syncLib(s);render();updateSheet();toast('Reseña guardada');return}
if(e.target.id==='score'){const s=byId(Number(e.target.dataset.id));if(!s.status)s.status=s.type==='Serie'?'Viendo':'Vista';syncLib(s);render();updateSheet();if(REAL)setTimeout(load,600)}});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id==='accpick'){TH.acc=e.target.value;saveTheme();applyTheme();return}
 if(id==='score'){const s=byId(Number(e.target.dataset.id)),v=Number(e.target.value);s.r.score=v;const C=2*Math.PI*26;$('#ringp').setAttribute('stroke-dashoffset',C*(1-v/100));$('#ringt').innerHTML=v?v+'<sup>%</sup>':'–';return}
 if(id==='q'){S.q=e.target.value;$('#results').innerHTML=results()}
 else if(FMAP[id])S.draft[FMAP[id]]=e.target.value
 else if(id==='f-post')S.pdraft.x=e.target.value
 else if(id==='f-pt')S.pdraft.id=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='f-pt')S.pdraft.id=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet!==null){S.sheet=null;updateSheet()}});
function fromHash(){const h=(location.hash||'').slice(1);if(VIEWS[h]&&h!==S.tab){S.tab=h;render(true)}}
window.addEventListener('hashchange',fromHash);
/* ---------- conexión con el servidor (si no hay, la app sigue con datos locales) ---------- */
function uid(){try{let u=localStorage.getItem('cs_uid');if(!u){u=crypto.randomUUID();localStorage.setItem('cs_uid',u)}return u}catch(_){return uid.t||(uid.t=crypto.randomUUID())}}
function send(path,method='GET',body){
 if(typeof fetch!=='function')return Promise.reject(new Error('sin red'));
 return fetch('/api'+path,{method,headers:{'content-type':'application/json','x-uid':uid()},body:body?JSON.stringify(body):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
function syncLib(s){if(s.status)send('/library/'+s.id,'PUT',{status:s.status,episode:s.ep,ratings:s.r,review:s.review||''}).catch(()=>{})}
const ago=d=>{const m=Math.max(0,Math.round((Date.now()-new Date(d.replace(' ','T')+'Z'))/60000));return m<2?'Ahora':m<60?`Hace ${m} min`:m<1440?`Hace ${Math.round(m/60)} h`:`Hace ${Math.round(m/1440)} d`};
function load(){
 send('/state').then(d=>{
  SHOWS.length=0;[GMAP,STATS,FRIENDS].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));[PREM,POSTS,CLUBS,POLL,DIRS,CRIT,NEWS].forEach(a=>a.length=0);REAL=true;
  WEEKLY=d.weekly||[];S.me=d.me||null;
  d.titles.forEach(t=>{if(byId(t.id))return;SHOWS.push({avg:t.avg,votes:t.votes,id:t.id,poster:t.poster,director:t.director,writers:t.writers,release:t.release_date,age:t.age,title:t.title,type:t.type,year:t.year||2026,eps:t.episodes,min:t.minutes,status:null,ep:0,platforms:JSON.parse(t.platforms||'[]'),tags:JSON.parse(t.tags||'[]'),hue:t.hue,leaving:null,r:{llorar:0,reir:0,tension:0,romance:0,comfort:0,slow:0},syn:t.synopsis,source:t.source,proposed:t.review_status==='pending'});if(t.genre)GMAP[t.id]=t.genre});
  d.library.forEach(l=>{const s=byId(l.title_id);if(!s)return;s.status=l.status==='En pausa'?'Viendo':l.status;s.ep=l.episode;s.review=l.review||'';try{s.r={...s.r,...JSON.parse(l.ratings||'{}')}}catch(_){}});
  d.posts.slice().reverse().forEach(p=>{if(POSTS.some(x=>x.k===p.id))return;const mine=p.liked>0;if(mine)S.liked.add(p.id);POSTS.unshift({k:p.id,u:p.handle,n:p.display,h:'@'+p.handle,t:ago(p.created_at),x:p.body,id:p.title_id,l:p.likes-(mine?1:0),c:0})});
  render();
 }).catch(()=>{});
}
fromHash();render(true);load();
(()=>{const sp=document.getElementById('splash');if(!sp)return;const red=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(red||TH.calm){sp.remove();return}$('#app').classList.add('opening');setTimeout(()=>{sp.remove();$('#app').classList.remove('opening')}, 2300)})();
</script>
</body>
</html>
